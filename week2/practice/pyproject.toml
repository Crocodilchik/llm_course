[project]
name = "week2-tool-agent"
version = "0.1.0"
description = "Five tools, a framework-free agent loop, and reproducible evaluations"
requires-python = ">=3.12"
dependencies = [
    "openai==3.24.0",
    "pydantic==2.13.5",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
