name: urushkin-week2-mvp
services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_DB: mvp
      POSTGRES_USER: mvp
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - ../private/mvp/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U mvp -d mvp"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  app:
    build:
      context: .
      target: runtime
    env_file:
      - path: ${MVP_ENV_FILE:-.env}
        required: false
    environment:
      MVP_DB_HOST: db
      MVP_DB_PASSWORD_FILE: /run/secrets/db_password
      MVP_POI_PATH: /data/poi.sqlite
      MVP_PRIVATE_PATH: /state
      HF_HOME: /models
      MVP_MODEL_CACHE: /models
      SENTENCE_TRANSFORMERS_HOME: /models
      TORCH_HOME: /models/torch
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      TMPDIR: /state/tmp
    secrets: [db_password]
    volumes:
      - ../poi.sqlite:/data/poi.sqlite:ro
      - ../private/mvp/app:/state
      - ../.cache/models:/models
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped
secrets:
  db_password:
    file: ../private/mvp/app/db_password
