[project]
name = "rostov-agent-mvp"
version = "0.1.0"
description = "Local multi-user city assistant with ADK and semantic search"
requires-python = ">=3.12,<3.13"
dependencies = [
  "google-adk[db]==2.12.0",
  "litellm>=1.84,!=1.82.7,!=1.82.8",
  "fastapi>=0.135",
  "uvicorn>=0.35",
  "jinja2>=3.1",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "aiosqlite>=0.21",
  "alembic>=1.16",
  "pgvector>=0.4",
  "argon2-cffi>=25",
  "python-dotenv>=1.1",
  "sentence-transformers>=5.0",
  "torch>=2.7",
  "mcp>=2.3,<3",
]

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1", "httpx>=0.28", "playwright>=1.55"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'"}]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q -p no:cacheprovider"
